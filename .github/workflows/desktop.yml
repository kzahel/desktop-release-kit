name: Desktop Canary

on:
  push:
    branches: [main]
    tags:
      - "desktop-v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  source-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend and release-tool checks
        run: pnpm check

      - name: Prepare the native sidecar
        run: pnpm prepare-sidecar

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path src-tauri/sidecar/Cargo.toml --all -- --check

      - name: Lint Rust
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/sidecar/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/sidecar/Cargo.toml

  build-desktop:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    needs: source-checks
    strategy:
      fail-fast: false
      # tauri-action merges one latest.json through the shared draft release.
      # Serialize tagged legs so two writers cannot replace it concurrently.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            runner: macos-26
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            runner: macos-26
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            args: ""
            rust_target: ""
          - platform: ubuntu-22.04-arm
            runner: ubuntu-22.04-arm
            args: ""
            rust_target: ""
          - platform: windows-latest
            runner: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.runner }}

    env:
      HAS_UPDATER_SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.MACOS_KEYCHAIN_PASSWORD != '' }}
      HAS_MACOS_NOTARIZATION: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' && secrets.ASC_API_KEY_ID != '' && secrets.ASC_API_ISSUER_ID != '' }}
      HAS_WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require tagged-release credentials
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          if [ "$HAS_UPDATER_SIGNING" != "true" ]; then
            echo "::error::Tagged releases require both Tauri updater signing secrets"
            exit 1
          fi
          if [ "$RUNNER_OS" = "macOS" ] && { [ "$HAS_MACOS_SIGNING" != "true" ] || [ "$HAS_MACOS_NOTARIZATION" != "true" ]; }; then
            echo "::error::Tagged macOS releases require Developer ID signing and notarization credentials"
            exit 1
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ "$HAS_WINDOWS_SIGNING" != "true" ]; then
            echo "::error::Tagged Windows releases require complete Azure Trusted Signing credentials"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./src-tauri/sidecar -> target
          key: ${{ matrix.runner }}-${{ matrix.rust_target || 'host' }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xdg-utils desktop-file-utils libarchive-tools

      - name: Set up macOS code-signing keychain
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm -f certificate.p12

      - name: Set up App Store Connect credentials
        if: runner.os == 'macOS' && env.HAS_MACOS_NOTARIZATION == 'true'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEY_PATH="$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Set signing environment
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          emit() {
            {
              printf '%s<<__CANARYEOF__\n' "$1"
              printf '%s\n' "$2"
              printf '__CANARYEOF__\n'
            } >> "$GITHUB_ENV"
          }

          if [ -n "$UPDATER_KEY" ]; then
            emit TAURI_SIGNING_PRIVATE_KEY "$UPDATER_KEY"
            emit TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$UPDATER_PASSWORD"
          fi
          if [ -n "$MACOS_CERTIFICATE" ] && [ "$RUNNER_OS" = "macOS" ]; then
            emit APPLE_CERTIFICATE "$MACOS_CERTIFICATE"
            emit APPLE_CERTIFICATE_PASSWORD "$MACOS_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Kyle Graehl (VD7BYQ6ABM)" >> "$GITHUB_ENV"
          fi
          if [ -n "$ASC_API_KEY_ID" ] && [ "$RUNNER_OS" = "macOS" ]; then
            emit APPLE_API_KEY "$ASC_API_KEY_ID"
            emit APPLE_API_ISSUER "$ASC_API_ISSUER_ID"
          fi

      - name: Install Azure signing tool
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        run: cargo install trusted-signing-cli

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract release notes
        id: changelog
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{found=0} found" CHANGELOG.md)
          echo "notes<<__NOTES__" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "__NOTES__" >> "$GITHUB_OUTPUT"

      - name: Build Tauri canary
        uses: tauri-apps/tauri-action@v0
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CANARY_BUILD_ID: ${{ github.sha }}
          TARGET_TRIPLE: ${{ matrix.rust_target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          projectPath: .
          tauriScript: pnpm tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'desktop-v__VERSION__' || '' }}
          releaseName: "Desktop Release Canary v__VERSION__"
          releaseBody: ${{ steps.changelog.outputs.notes || 'Signed desktop update infrastructure canary.' }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ startsWith(github.ref, 'refs/tags/') }}
          updaterJsonPreferNsis: true
          updaterJsonKeepUniversal: true
          retryAttempts: ${{ runner.os == 'macOS' && '1' || '0' }}
          args: >-
            ${{ matrix.args }}
            ${{ runner.os == 'macOS' && env.HAS_MACOS_SIGNING != 'true' && '--no-sign' || '' }}
            ${{ env.HAS_UPDATER_SIGNING != 'true' && '--config ''{"bundle":{"createUpdaterArtifacts":false}}''' || '' }}
            ${{ runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true' && '--config ''{"bundle":{"windows":{"signCommand":"trusted-signing-cli -e https://eus.codesigning.azure.net -a kylegraehl -c jstorrent-profile %1"}}}''' || '' }}

      - name: Verify macOS signing and notarization
        if: runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true' && env.HAS_MACOS_NOTARIZATION == 'true'
        shell: bash
        run: |
          APP_PATH="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Desktop Release Canary.app"
          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          test -x "$APP_PATH/Contents/MacOS/canary-sidecar"
          codesign --verify --strict --verbose=2 "$APP_PATH/Contents/MacOS/canary-sidecar"
          DMG_PATH=$(find "src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)
          test -n "$DMG_PATH"
          codesign --verify --verbose=2 "$DMG_PATH"

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifacts = @(
            @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File)
            @(Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*.msi' -File)
            @(Get-ChildItem 'src-tauri/binaries' -Filter 'canary-sidecar-*.exe' -File)
          )
          if ($artifacts.Count -ne 3) {
            throw "Expected NSIS, MSI, and sidecar artifacts; found $($artifacts.Count)"
          }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($artifact.Name) does not have a valid Authenticode signature"
            }
            if ($signature.SignerCertificate.Subject -notmatch 'CN=Kyle Graehl(?:,|$)') {
              throw "$($artifact.Name) has unexpected signer $($signature.SignerCertificate.Subject)"
            }
          }

      - name: Verify Linux bundle matrix
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1
          test "$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' | wc -l)" -eq 1
          SIDECAR=$(find src-tauri/binaries -maxdepth 1 -type f -name 'canary-sidecar-*' -print -quit)
          test -x "$SIDECAR"
          "$SIDECAR" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s);if(p.schemaVersion!==1)process.exit(1)})'

      - name: Clean up macOS keychain
        if: runner.os == 'macOS' && always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -rf ~/private_keys 2>/dev/null || true

  finalize-release:
    if: always() && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [source-checks, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Keep failed builds private
        if: needs.source-checks.result != 'success' || needs.build-desktop.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --draft
            echo "::error::Required jobs failed; $GITHUB_REF_NAME remains a draft"
          else
            echo "::error::Required jobs failed; no release was created"
          fi
          exit 1

      - name: Download and validate the complete draft
        if: needs.source-checks.result == 'success' && needs.build-desktop.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_DIR="$RUNNER_TEMP/desktop-release"
          mkdir -p "$RELEASE_DIR"
          gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,assets > "$RELEASE_DIR/release.json"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RELEASE_DIR"
          node .github/scripts/validate-release.mjs \
            --release "$RELEASE_DIR/release.json" \
            --latest "$RELEASE_DIR/latest.json" \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY"
          node .github/scripts/write-release-checksums.mjs \
            "$RELEASE_DIR/release.json" "$RELEASE_DIR/SHA256SUMS"
          gh release upload "$GITHUB_REF_NAME" "$RELEASE_DIR/SHA256SUMS" --clobber

      - name: Remove redundant detached signatures
        if: needs.source-checks.result == 'success' && needs.build-desktop.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name | select(endswith(".sig"))' |
          while read -r name; do
            if [ -n "$name" ]; then gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes; fi
          done

      - name: Write release evidence
        if: needs.source-checks.result == 'success' && needs.build-desktop.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          CHANGELOG=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{found=0} found" CHANGELOG.md)
          {
            echo "$CHANGELOG"
            echo
            echo "## Automated release evidence"
            echo
            echo "- Five signed updater targets validated from \`latest.json\`."
            echo "- Developer ID signing and notarization validated for both macOS architectures."
            echo "- Authenticode signatures validated for Windows NSIS, MSI, and the nested sidecar."
            echo "- Linux AppImage, DEB, and RPM packages validated for x86_64 and ARM64."
            echo "- Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Exact hashes: https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/SHA256SUMS"
            echo
            echo "Installed old-to-new testbed evidence is recorded separately and is not implied by CI."
          } > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Publish validated release
        if: needs.source-checks.result == 'success' && needs.build-desktop.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
