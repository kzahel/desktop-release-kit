[package]
name = "desktop-release-canary"
version = "0.2.0"
description = "Signed desktop update infrastructure canary"
authors = ["Kyle Graehl <kgraehl@gmail.com>"]
edition = "2021"
default-run = "desktop-release-canary"

[lib]
name = "desktop_release_canary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "desktop-release-canary"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
url = "2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }

tempfile = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

# Keep routine dev and test builds small while retaining file/line backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

# Opt into full source-level debugger data in an isolated output directory.
[profile.debugging]
inherits = "dev"
opt-level = 0
debug = "full"
