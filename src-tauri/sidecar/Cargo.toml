[package]
name = "canary-sidecar"
version = "0.1.0"
description = "Nested build-identity probe for Desktop Release Canary"
authors = ["Kyle Graehl <kgraehl@gmail.com>"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
